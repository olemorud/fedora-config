---
- name: Add Flathub
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present

- name: Install flatpaks
  become: true
  community.general.flatpak:
    name: "{{ flatpaks }}"
    remote: flathub
    state: present

- name: Remove flatpaks
  become: true
  community.general.flatpak:
    name: "{{ flatpaks_absent }}"
    state: absent
  when: flatpaks_absent | length > 0

- name: Apply dconf settings
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ dconf }}"
  loop_control:
    label: "{{ item.key }}"
