---
- name: Configure dnf
  become: true
  ansible.builtin.copy:
    src: etc/dnf/libdnf5.conf.d/local.conf
    dest: /etc/dnf/libdnf5.conf.d/local.conf
    mode: "0644"

- name: Enable RPM Fusion
  become: true
  ansible.builtin.dnf5:
    name: >-
      {{ rpmfusion_url }}/{{ item }}/fedora/rpmfusion-{{ item }}-release-{{
      ansible_facts['distribution_major_version'] }}.noarch.rpm
    disable_gpg_check: true
    state: present
  loop: [free, nonfree]

- name: Install packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages }}"
    state: present

# The steam-devices rules tag /dev/uinput with "uaccess", which is what
# lets the seat user open it. Rules only apply to a device that already
# exists after a trigger, and a package that was installed earlier never
# triggers one, so check the tag instead of relying on a package change.
- name: Read uinput udev tags
  ansible.builtin.command: udevadm info /dev/uinput
  register: uinput_info
  changed_when: false
  failed_when: false

- name: Apply udev rules to present devices
  become: true
  ansible.builtin.shell: >-
    udevadm control --reload &&
    udevadm trigger --action=change
    --subsystem-match=misc --subsystem-match=input
    --subsystem-match=hidraw
  changed_when: true
  when: "'uaccess' not in uinput_info.stdout"

- name: Install freeworld packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages_freeworld }}"
    allowerasing: true
    state: present

- name: Remove packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages_absent }}"
    state: absent
  notify: Stop zram

- name: Set system locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: ^LANG=
    line: LANG={{ locale }}
    create: true
    mode: "0644"

- name: Find the root filesystem
  ansible.builtin.set_fact:
    root_mount: >-
      {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
      | first }}

- name: Check that / is Btrfs
  ansible.builtin.assert:
    that: root_mount['fstype'] == 'btrfs'
    fail_msg: / is not Btrfs; adjust the swap and bees tasks
    quiet: true

- name: Create swap subvolume
  become: true
  ansible.builtin.shell: btrfs subvolume create /swap && chmod 0700 /swap
  args:
    creates: /swap

- name: Create swap file
  become: true
  ansible.builtin.command: >-
    btrfs filesystem mkswapfile --size {{ swap_size }} /swap/swapfile
  args:
    creates: /swap/swapfile

- name: Install systemd units
  become: true
  ansible.builtin.copy:
    src: etc/systemd/system/{{ item }}
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - zswap.service
    - swap-swapfile.swap

# Gigabyte B550 firmware bug: GPP0 wakes the machine immediately after
# suspend. Only install and enable the workaround on the affected board.
- name: Install suspend fix (B550I AORUS PRO AX)
  become: true
  ansible.builtin.copy:
    src: etc/systemd/system/fix-suspend.service
    dest: /etc/systemd/system/fix-suspend.service
    mode: "0644"
  when: ansible_facts['board_name'] == 'B550I AORUS PRO AX'
  register: suspend_unit
  notify: Reload systemd

- name: Flush handlers before enabling suspend fix
  ansible.builtin.meta: flush_handlers

# Check mode does not write the unit file, so systemd cannot find it
# and the enable would fail; skip it only in that case.
- name: Enable suspend fix (B550I AORUS PRO AX)
  become: true
  ansible.builtin.systemd_service:
    name: fix-suspend.service
    enabled: true
    state: started
  when:
    - ansible_facts['board_name'] == 'B550I AORUS PRO AX'
    - not (ansible_check_mode and suspend_unit is changed)

- name: Set Btrfs compression level
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: (compress=zstd)(:-?\d+)?
    replace: \g<1>:{{ zstd_level }}
  notify:
    - Reload systemd
    - Remount root

- name: Configure bees
  become: true
  ansible.builtin.copy:
    dest: /etc/bees/root.conf
    content: |
      # The filesystem holding / and /home. bees mounts the top-level
      # subvolume itself and skips nodatacow files (VM images, swap).
      UUID={{ root_mount['uuid'] }}
      DB_SIZE=$(({{ bees_db_size }}*1024*1024))
      OPTIONS="--thread-count 4"
    mode: "0644"
  notify: Restart bees

- name: Enable bees
  become: true
  ansible.builtin.systemd_service:
    name: beesd@{{ root_mount['uuid'] }}.service
    enabled: true
    state: started
    daemon_reload: true

- name: Tune sysctl
  become: true
  ansible.builtin.copy:
    src: etc/sysctl.d/99-local.conf
    dest: /etc/sysctl.d/99-local.conf
    mode: "0644"
  notify: Reload sysctl

- name: Enable services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ services }}"

- name: Add user to groups
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: "{{ user_groups }}"
    append: true
    shell: /usr/bin/zsh
