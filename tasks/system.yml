---
- name: Configure dnf
  become: true
  ansible.builtin.copy:
    src: etc/dnf/libdnf5.conf.d/local.conf
    dest: /etc/dnf/libdnf5.conf.d/local.conf
    mode: "0644"

- name: Enable RPM Fusion
  become: true
  ansible.builtin.dnf5:
    name: >-
      {{ rpmfusion_url }}/{{ item }}/fedora/rpmfusion-{{ item }}-release-{{
      ansible_facts['distribution_major_version'] }}.noarch.rpm
    disable_gpg_check: true
    state: present
  loop: [free, nonfree]

- name: Install packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages }}"
    state: present

- name: Install freeworld packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages_freeworld }}"
    allowerasing: true
    state: present

- name: Remove packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages_absent }}"
    state: absent
  notify: Stop zram

- name: Check that / is Btrfs
  ansible.builtin.assert:
    that: root_mount['fstype'] == 'btrfs'
    fail_msg: / is not Btrfs; adjust the swap file tasks
    quiet: true
  vars:
    root_mount: >-
      {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
      | first }}

- name: Create swap subvolume
  become: true
  ansible.builtin.shell: btrfs subvolume create /swap && chmod 0700 /swap
  args:
    creates: /swap

- name: Create swap file
  become: true
  ansible.builtin.command: >-
    btrfs filesystem mkswapfile --size {{ swap_size }} /swap/swapfile
  args:
    creates: /swap/swapfile

- name: Install systemd units
  become: true
  ansible.builtin.copy:
    src: etc/systemd/system/{{ item }}
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - zswap.service
    - swap-swapfile.swap

- name: Tune sysctl
  become: true
  ansible.builtin.copy:
    src: etc/sysctl.d/99-local.conf
    dest: /etc/sysctl.d/99-local.conf
    mode: "0644"
  notify: Reload sysctl

- name: Enable services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ services }}"

- name: Add user to groups
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: "{{ user_groups }}"
    append: true
    shell: /usr/bin/zsh
