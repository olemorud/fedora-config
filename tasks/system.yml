---
- name: Configure dnf
  become: true
  ansible.builtin.copy:
    src: etc/dnf/libdnf5.conf.d/local.conf
    dest: /etc/dnf/libdnf5.conf.d/local.conf
    mode: "0644"

- name: Configure automatic updates
  become: true
  ansible.builtin.copy:
    src: etc/dnf/automatic.conf
    dest: /etc/dnf/automatic.conf
    mode: "0644"

- name: Create the dnf5-automatic timer drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/dnf5-automatic.timer.d
    state: directory
    mode: "0755"

- name: Schedule automatic updates
  become: true
  ansible.builtin.copy:
    src: etc/systemd/system/dnf5-automatic.timer.d/desktop.conf
    dest: /etc/systemd/system/dnf5-automatic.timer.d/desktop.conf
    mode: "0644"
  notify: Reload systemd

# Two dnf transactions that are a no-op on every run after the first,
# and a dnf transaction costs seconds. A stat is free, so check for the
# repo file the release package drops and skip when it is there.
- name: Check for RPM Fusion
  ansible.builtin.stat:
    path: /etc/yum.repos.d/rpmfusion-{{ item }}.repo
  register: rpmfusion_repos
  loop: [free, nonfree]

- name: Enable RPM Fusion
  become: true
  ansible.builtin.dnf5:
    name: >-
      {{ rpmfusion_url }}/{{ item.item }}/fedora/rpmfusion-{{ item.item
      }}-release-{{ ansible_facts['distribution_major_version']
      }}.noarch.rpm
    disable_gpg_check: true
    state: present
  loop: "{{ rpmfusion_repos.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Install packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages + packages_machine }}"
    state: present
  register: packages_installed

# The steam-devices rules tag /dev/uinput with "uaccess", which is what
# lets the seat user open it. Rules only apply to a device that already
# exists after a trigger, and a package that was installed earlier never
# triggers one, so check the tag instead of relying on a package change.
- name: Read uinput udev tags
  ansible.builtin.command: udevadm info /dev/uinput
  register: uinput_info
  changed_when: false
  failed_when: false

- name: Apply udev rules to present devices
  become: true
  ansible.builtin.shell: >-
    udevadm control --reload &&
    udevadm trigger --action=change
    --subsystem-match=misc --subsystem-match=input
    --subsystem-match=hidraw
  changed_when: true
  when: "'uaccess' not in uinput_info.stdout"

- name: Install freeworld packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages_freeworld + packages_freeworld_machine }}"
    allowerasing: true
    state: present

# allowerasing: the dnf5 CLI always allows erasing on remove, so
# dependents of a removed package go with it; the module does not, and
# fails to resolve instead (libreoffice-writer vs libreoffice-core).
# autoremove: the module overrides clean_requirements_on_remove with
# this flag, so without it every removal leaves its dependencies behind.
# It also drops already-orphaned dependencies anywhere on the system;
# `dnf mark user <pkg>` protects one that should stay.
- name: Remove packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ packages_absent }}"
    state: absent
    allowerasing: true
    autoremove: true
  notify: Stop zram

- name: Set system locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: ^LANG=
    line: LANG={{ locale }}
    create: true
    mode: "0644"

- name: Find the root filesystem
  ansible.builtin.set_fact:
    root_mount: >-
      {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
      | first }}

- name: Check that / is Btrfs
  ansible.builtin.assert:
    that: root_mount['fstype'] == 'btrfs'
    fail_msg: / is not Btrfs; adjust the swap and bees tasks
    quiet: true

- name: Create swap subvolume
  become: true
  ansible.builtin.shell: btrfs subvolume create /swap && chmod 0700 /swap
  args:
    creates: /swap

- name: Create swap file
  become: true
  ansible.builtin.command: >-
    btrfs filesystem mkswapfile --size {{ swap_size }} /swap/swapfile
  args:
    creates: /swap/swapfile

- name: Install systemd units
  become: true
  ansible.builtin.copy:
    src: etc/systemd/system/{{ item }}
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  register: unit_files
  loop:
    - zswap.service
    - swap-swapfile.swap

- name: Set Btrfs compression level
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: (compress=zstd)(:-?\d+)?
    replace: \g<1>:{{ zstd_level }}
  notify:
    - Reload systemd
    - Remount root

- name: Configure bees
  become: true
  ansible.builtin.copy:
    dest: /etc/bees/root.conf
    content: |
      # The filesystem holding / and /home. bees mounts the top-level
      # subvolume itself and skips nodatacow files (VM images, swap).
      UUID={{ root_mount['uuid'] }}
      DB_SIZE=$(({{ bees_db_size }}*1024*1024))
      # -v 4 logs warnings and errors only; the default (8) logs every
      # crawl and dedupe at info/notice, which floods the journal.
      OPTIONS="--thread-count 4 --verbose 4"
    mode: "0644"
  notify: Restart bees

# Same as the suspend fix in tasks/machine.yml: check mode installs
# nothing, so a unit that a package would have provided does not exist
# and systemd cannot be asked about it.
- name: Enable bees
  become: true
  ansible.builtin.systemd_service:
    name: beesd@{{ root_mount['uuid'] }}.service
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and packages_installed is changed)

- name: Tune sysctl
  become: true
  ansible.builtin.copy:
    src: etc/sysctl.d/99-local.conf
    dest: /etc/sysctl.d/99-local.conf
    mode: "0644"
  notify: Reload sysctl

# Units come from packages and from the copy task above; in check mode
# neither has happened yet.
- name: Enable services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ services }}"
  when: >-
    not (ansible_check_mode and
    (packages_installed is changed or unit_files is changed))

- name: Set login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
