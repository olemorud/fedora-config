---
# Set up the fedora-backup workflow (github.com/olemorud/fedora-backup).
# Its tools (btrfs-progs, zstd, gnupg2, rclone) are already in
# `packages`, and flatpak data dirs are excluded generically in
# tasks/desktop.yml. Not automated, by design: the rclone remote "b2"
# (secret, `rclone config` by hand once) and the gpg passphrase
# (memorized). backup.sh itself stays manual; gpg prompts for the
# passphrase.

# update: false means this is a clone-once; the checkout tracks main
# by hand afterwards, so pinning a version would be noise.
- name: Clone the fedora-backup repository  # noqa: latest[git]
  ansible.builtin.git:
    repo: git@github.com:olemorud/fedora-backup.git
    dest: "{{ ansible_facts['user_dir'] }}/fedora-backup"
    update: false
