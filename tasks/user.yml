---
- name: Create vim and cache directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .vim/swapfiles
    - .vim/backups
    - .cache

- name: Copy home files
  ansible.builtin.copy:
    src: home/
    dest: "{{ ansible_facts['user_dir'] }}/"
    mode: "0644"
    directory_mode: "0755"
