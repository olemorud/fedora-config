---
# Everything that is a list lives here. Task files should not need editing
# when adding or removing a package. Machine-specific values are in
# machine.yml.

rpmfusion_url: https://mirrors.rpmfusion.org

locale: en_DK.UTF-8
zstd_level: 3                 # Btrfs compression level, Fedora ships 1

# Packages that replace their Fedora counterparts (needs allowerasing).
packages_freeworld:
  - ffmpeg                      # replaces ffmpeg-free

packages:
  - autoconf
  - automake
  - bear                        # compile_commands.json for clangd
  - bees
  - btrfs-assistant
  - btrfs-progs
  - ccache
  - clang
  - clang-tools-extra
  - cmake
  - compsize
  - cppcheck
  - dnf5-plugin-automatic       # background download of updates
  - fd-find
  - fio                         # Disk benchmarking
  - gcc
  - gcc-c++
  - gdb
  - git
  - git-credential-libsecret
  - git-lfs
  - glibc-langpack-en
  - gnupg2
  - htop
  - jq
  - libasan
  - libtool
  - libubsan
  - lld
  - lldb
  - make
  - man-pages
  - meson
  - ninja-build
  - perf
  - pipx
  - pkgconf
  - podman
  - podman-compose
  - pv
  - python3
  - python3-devel
  - python3-pip
  - qemu-kvm                    # direct qemu use; Boxes bundles its own
  - rclone
  - ripgrep
  - snapper
  - steam-devices               # udev rules for controllers (Steam flatpak)
  - strace
  - tmux
  - uv
  - valgrind
  - vim-X11                     # vimx: +clipboard, works via XWayland
  - vim-enhanced
  - wl-clipboard
  - zsh
  - zstd

  # Needed by this playbook
  - ansible-core
  # profile_tasks, the callback that times each task
  - ansible-collection-ansible-posix
  - ansible-collection-community-general
  - python3-psutil              # community.general.dconf
  - python3-ansible-lint
  - yamllint
  - ShellCheck

# zram is replaced by zswap plus a swap file, see docs/decisions.md.
# The rest are RPMs replaced by a flatpak, or the libvirt layer that
# Boxes (flatpak) makes unnecessary; qemu-kvm itself stays. dnf also
# removes what depends on these and, with clean_requirements_on_remove,
# the dependencies that nothing else needs (see
# files/etc/dnf/libdnf5.conf.d/local.conf).
packages_absent:
  - firefox
  - gnome-boxes
  - libreoffice-core            # takes every libreoffice-* with it
  - libvirt
  - mediawriter
  - virt-manager
  - zram-generator-defaults

# flathub. Every flatpak's data dir under ~/.var/app is made a btrfs
# subvolume (tasks/desktop.yml), so btrfs send skips it: app data is
# not backed up. Anything worth keeping must sync itself (Firefox
# Sync, Signal linked devices, IMAP) or live outside ~/.var/app.
flatpaks:
  - app.bluebubbles.BlueBubbles
  - com.discordapp.Discord
  - com.github.tchx84.Flatseal
  - com.spotify.Client
  - com.valvesoftware.Steam
  - org.fedoraproject.MediaWriter
  - org.gnome.Boxes               # bundles qemu; no libvirt on the host
  - org.gnome.Firmware
  - org.libreoffice.LibreOffice
  - org.mozilla.firefox
  - org.signal.Signal

# From the fedora remote, not Flathub. See docs/decisions.md.
flatpaks_fedora:
  - net.thunderbird.Thunderbird

services:
  - zswap.service
  - swap-swapfile.swap
  # Downloads updates only; see files/etc/dnf/automatic.conf.
  - dnf5-automatic.timer

dconf:
  # Region (date, time, numbers, paper) for the GNOME session
  - key: /org/gnome/system/locale/region
    value: "'{{ locale }}'"
  - key: /org/gnome/desktop/interface/clock-format
    value: "'24h'"
  - key: /org/gnome/desktop/interface/clock-show-weekday
    value: "true"
  - key: /org/gnome/desktop/peripherals/mouse/accel-profile
    value: "'flat'"
  - key: /org/gnome/desktop/wm/preferences/button-layout
    value: "'appmenu:minimize,maximize,close'"
  - key: /org/gnome/mutter/experimental-features
    value: "['variable-refresh-rate']"
