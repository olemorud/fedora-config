---
# Everything that is a list lives here. Task files should not need editing
# when adding or removing a package.

rpmfusion_url: https://mirrors.rpmfusion.org

locale: en_DK.UTF-8
swap_size: 16g
bees_db_size: 512             # MiB, hash table; multiple of 128 KiB
zstd_level: 3                 # Btrfs compression level, Fedora ships 1

# Packages that replace their Fedora counterparts (needs allowerasing).
packages_freeworld:
  - ffmpeg                      # replaces ffmpeg-free
  - mesa-va-drivers-freeworld   # VA-API for h264/hevc on the RX 6800

packages:
  # C/C++ toolchain
  - gcc
  - gcc-c++
  - clang
  - clang-tools-extra           # clangd, clang-format, clang-tidy
  - lld
  - lldb
  - gdb
  - make
  - cmake
  - ninja-build
  - meson
  - ccache
  - bear                        # compile_commands.json for clangd
  - valgrind
  - strace
  - perf
  - cppcheck
  - libasan
  - libubsan
  - autoconf
  - automake
  - libtool
  - pkgconf

  # Languages and containers
  - python3
  - python3-devel
  - python3-pip
  - pipx
  - uv                          # venvs as reflinks, see .config/uv/uv.toml
  - podman
  - podman-compose

  # Editor and shell
  - vim-enhanced
  - vim-X11                     # vimx: +clipboard, works via XWayland
  - wl-clipboard
  - zsh
  - git
  - git-lfs
  - git-credential-libsecret
  - tmux
  - htop
  - ripgrep
  - fd-find
  - jq
  - man-pages
  - rclone                      # used by the gd shell functions
  - zstd

  # Virtualization
  - virt-manager
  - libvirt
  - qemu-kvm

  # Btrfs
  - btrfs-progs
  - btrfs-assistant
  - snapper
  - compsize
  - bees                        # continuous dedup, see docs/decisions.md

  # Hardware
  - steam-devices               # udev rules for controllers (Steam flatpak)
  - radeontop

  # Locale
  - glibc-langpack-en

  # Needed by this playbook
  - ansible-core
  - ansible-collection-community-general
  - python3-psutil              # community.general.dconf
  - python3-ansible-lint
  - yamllint
  - ShellCheck

# zram is replaced by zswap plus a swap file, see docs/decisions.md.
packages_absent:
  - zram-generator-defaults

flatpaks:
  - com.valvesoftware.Steam
  - com.discordapp.Discord
  - org.mozilla.Thunderbird
  - com.spotify.Client
  - org.signal.Signal
  - com.github.tchx84.Flatseal

services:
  - zswap.service
  - swap-swapfile.swap
  # Modular libvirt daemons; libvirtd.service is deprecated.
  - virtqemud.socket
  - virtnetworkd.socket
  - virtstoraged.socket

user_groups:
  - libvirt

dconf:
  # Region (date, time, numbers, paper) for the GNOME session
  - key: /org/gnome/system/locale/region
    value: "'{{ locale }}'"
  - key: /org/gnome/desktop/interface/clock-format
    value: "'24h'"
  - key: /org/gnome/desktop/interface/clock-show-weekday
    value: "true"
  - key: /org/gnome/desktop/peripherals/mouse/accel-profile
    value: "'flat'"
  - key: /org/gnome/desktop/wm/preferences/button-layout
    value: "'appmenu:minimize,maximize,close'"
  - key: /org/gnome/mutter/experimental-features
    value: "['variable-refresh-rate']"
