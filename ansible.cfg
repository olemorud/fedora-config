[defaults]
interpreter_python = /usr/bin/python3
localhost_warning = false
nocows = true

# Iteration time. Facts are cached for an hour, so a repeat run inside a
# working session skips gathering entirely; the cache goes stale by the
# next day on its own. Bust it by hand with
# `rm -rf ~/.cache/ansible/facts` after changing disks or hardware.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.cache/ansible/facts
fact_caching_timeout = 3600

# Print the slowest tasks at the end of every run, so tuning this is
# measured rather than guessed.
callbacks_enabled = ansible.posix.profile_tasks

# No inventory file; the playbook targets the implicit localhost.
[inventory]
inventory_unparsed_warning = false

[callback_profile_tasks]
task_output_limit = 10
