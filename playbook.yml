---
- name: Configure this Fedora Workstation
  hosts: localhost
  connection: local
  # Everything the playbook reads: distribution and user from min, mounts
  # and board_name from hardware. Skips network, virtual and the rest.
  gather_subset: [min, hardware]
  vars_files:
    - vars.yml
    - machine.yml

  tasks:
    - name: Machine
      ansible.builtin.import_tasks: tasks/machine.yml
      tags: [machine]

    - name: System
      ansible.builtin.import_tasks: tasks/system.yml
      tags: [system]

    - name: Desktop
      ansible.builtin.import_tasks: tasks/desktop.yml
      tags: [desktop]

    - name: User
      ansible.builtin.import_tasks: tasks/user.yml
      tags: [user]

  handlers:
    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Compression is a filesystem-wide option; remounting / covers /home.
    # fstab is edited in place above, so the mount module is not wanted.
    - name: Remount root  # noqa: command-instead-of-module
      become: true
      ansible.builtin.command: mount -o remount,compress=zstd:{{ zstd_level }} /
      changed_when: true

    - name: Restart bees
      become: true
      ansible.builtin.systemd_service:
        name: beesd@{{ root_mount['uuid'] }}.service
        state: restarted

    - name: Reload sysctl
      become: true
      ansible.builtin.command: sysctl --system
      changed_when: true

    # The generated unit is gone once the package is removed, so this only
    # frees the device in the running session; the reboot does the rest.
    - name: Stop zram
      become: true
      ansible.builtin.command: swapoff /dev/zram0
      changed_when: true
      failed_when: false
