---
- name: Configure this Fedora Workstation
  hosts: localhost
  connection: local
  vars_files:
    - vars.yml

  tasks:
    - name: System
      ansible.builtin.import_tasks: tasks/system.yml
      tags: [system]

    - name: Desktop
      ansible.builtin.import_tasks: tasks/desktop.yml
      tags: [desktop]

    - name: User
      ansible.builtin.import_tasks: tasks/user.yml
      tags: [user]

  handlers:
    - name: Reload sysctl
      become: true
      ansible.builtin.command: sysctl --system
      changed_when: true

    # The generated unit is gone once the package is removed, so this only
    # frees the device in the running session; the reboot does the rest.
    - name: Stop zram
      become: true
      ansible.builtin.command: swapoff /dev/zram0
      changed_when: true
      failed_when: false
