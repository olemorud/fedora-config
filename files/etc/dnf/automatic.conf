# Overrides on top of /usr/share/dnf5/dnf5-plugins/automatic.conf.
# Download updates in the background, never install, never reboot.
# Installing stays a deliberate act: dnf upgrade, or GNOME Software.

[commands]
upgrade_type = default
download_updates = yes
apply_updates = no
reboot = never

# The systemd timer already applies a randomized delay, see the drop-in
# for dnf5-automatic.timer.
random_sleep = 0

# The machine is off at night, so the timer normally catches up shortly
# after boot, when NetworkManager may still be settling.
network_online_timeout = 300

[emitters]
# stdio from a systemd service means the journal:
# journalctl -u dnf5-automatic.service
emit_via = stdio
emit_no_updates = no
